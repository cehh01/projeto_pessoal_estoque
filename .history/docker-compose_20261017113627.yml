services:
  # Container da Aplicação (PHP)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: estoque-app
    container_name: estoque-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - estoque-network

  # Container do Servidor Web (Nginx)
nginx:
    image: nginx:alpine
    container_name: estoque-nginx
    restart: unless-stopped
    ports:
      - "80:80"   # <-- Alterado de 8000:80 para 80:80
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - estoque-network

  # Container do Banco de Dados (MySQL)
  db:
    image: mysql:8.0
    container_name: estoque-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: estoque
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - estoque-network

networks:
  estoque-network:
    driver: bridge

volumes:
  dbdata:
    driver: local